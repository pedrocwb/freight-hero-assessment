[project]
name = "freight-agent"
version = "0.1.0"
description = "Agent that monitors freight loads and follows each broker's SOP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.0",
    "langsmith>=0.4",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
agent = "freight_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "types-pyyaml",
    "pre-commit>=4.7.0",
    "langgraph-cli[inmem]>=0.4.37",
    "langgraph-api>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: fast tests with no network",
    "contract: port contract suites, run against the memory store",
    "property: hypothesis property tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = [
    "src/freight_agent/domain",
    "src/freight_agent/interfaces",
    "src/freight_agent/application",
]

[tool.coverage.run]
source = ["src/freight_agent"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
include = [
    "src/freight_agent/domain/*",
    "src/freight_agent/application/*",
]

[tool.importlinter]
root_package = "freight_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["freight_agent.domain"]
forbidden_modules = [
    "freight_agent.interfaces",
    "freight_agent.application",
    "freight_agent.adapters",
    "freight_agent.api",
    "freight_agent.evalkit",
    "freight_agent.bootstrap",
    "langchain",
    "langgraph",
    "fastapi",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "interfaces depend only on the domain"
type = "forbidden"
source_modules = ["freight_agent.interfaces"]
forbidden_modules = [
    "freight_agent.application",
    "freight_agent.adapters",
    "freight_agent.api",
    "freight_agent.evalkit",
    "freight_agent.bootstrap",
    "langchain",
    "langgraph",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "application does not know adapters or the api"
type = "forbidden"
source_modules = ["freight_agent.application"]
forbidden_modules = [
    "freight_agent.adapters",
    "freight_agent.api",
    "freight_agent.evalkit",
    "freight_agent.bootstrap",
    "langchain",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "adapters do not know application or the api"
type = "forbidden"
source_modules = ["freight_agent.adapters"]
forbidden_modules = [
    "freight_agent.application",
    "freight_agent.api",
    "freight_agent.evalkit",
    "freight_agent.bootstrap",
]

[[tool.importlinter.contracts]]
name = "evalkit does not know the api"
type = "forbidden"
source_modules = ["freight_agent.evalkit"]
forbidden_modules = ["freight_agent.api"]
