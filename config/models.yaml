# Models per role, their fallbacks and prices.
#
# Switching a model is a change to this file, measured with the live evals first
# (evals/RESULTS.md). Cheap, light models first; prompts and SOPs are improved on them
# before any model is upgraded.
#
# Every model here comes from the public catalog https://openrouter.ai/api/v1/models,
# fetched on 2026-10-19, and lists `tools`, `tool_choice` and `structured_outputs` among
# its supported parameters. Structured output is a forced tool call (see
# adapters/llm/openrouter.py), so `tools` + `tool_choice` are the hard requirement.
#
# Role settings:
#   model             OpenRouter model id (primary)
#   fallbacks         ordered; walked by the resilient wrapper (adapters/llm/resilient.py),
#                     one OpenRouterModel per entry, once the model before it failed (its
#                     retries included). An entry is a model id, which runs with the
#                     primary's settings, or a mapping with `model` and the settings below
#                     it changes (temperature, max_tokens, reasoning_effort, provider).
#                     Pick another provider family for availability, and a model that
#                     passes the suites on its settings.
#   temperature       null: not sent. Some reasoning models (Claude Haiku 5.5, GPT-6 Luna)
#                     take no temperature; with require_parameters on, sending one leaves
#                     them no endpoint, so a role or a fallback on such a model sets null.
#   max_tokens        completion cap, reasoning tokens included
#   reasoning_effort  optional: none | minimal | low | medium | high
#   provider          OpenRouter provider routing for the primary model (a fallback uses
#                     default routing unless its entry sets one). `order` puts the
#                     preferred provider first, the one the evals measured and the prices
#                     below assume; `allow_fallbacks: true` lets OpenRouter serve the same
#                     model from another provider that passes the other filters when that
#                     one fails or rate limits, before the chain moves to another model.
#                     The trade-off is reproducibility: such a call ran on another
#                     endpoint, maybe at another price, and the run records which
#                     (`Usage.provider`, from OpenRouter's routing metadata).
#                     require_parameters defaults to true: only endpoints that honour every
#                     parameter we send (notably a forced tool_choice), which can leave a
#                     single endpoint to route to.
#
# A call the provider rate limits or reports overloaded (HTTP 429, 502, 503, 529) is
# retried on the same model first: at most twice, after about 1 s then 2 s with jitter, or
# the provider's Retry-After when it is 8 s or less, and always within the call's timeout
# (RetryPolicy in adapters/llm/resilient.py). Then the next fallback serves it.

roles:
  gate:
    # Classification into a small enum, the cheapest reliable structured output.
    # GPT-4.1 Nano: no reasoning, fast first token, forced tool calls are solid.
    # OpenAI first, then the same model on Azure (both force tool calls).
    model: openai/gpt-4.1-nano
    fallbacks: [google/gemini-2.5-flash-lite]
    temperature: 0
    max_tokens: 256
    provider:
      order: [openai]
      allow_fallbacks: true

  agent:
    # The agent loop: one model round per graph step, with read and action tools, for at
    # most the client's `limits.max_steps` rounds and `limits.max_cost_usd`, then `finish`.
    # gpt-oss-120b is the only model of the bake-off that met every threshold
    # (evals/RESULTS.md, "How the agent model was chosen"), at about $0.0007 per run;
    # Claude Haiku 5.5 passed too, at about 3.6 times the cost, and is the first upgrade.
    # gpt-oss always reasons; low effort keeps an agent call near 7 s (p95 about 15 s).
    # DeepInfra at bf16 first, the endpoint the evals measured, and fallbacks allowed to
    # any other bf16 endpoint that takes every parameter sent. On 2026-10-20 there is
    # none: DekaLLM, AkashML and Crusoe serve gpt-oss at bf16 but take only
    # `tool_choice: auto`, and every agent round forces a tool call (`required`, or the
    # answer tool by name), so OpenRouter's routing reports "available=1" and a DeepInfra
    # rate limit comes back as a 429 (evals/RESULTS.md): the same-model retries absorb
    # most, the next fallback the rest. The other endpoints that force tool calls are fp16
    # (Cerebras, $0.35 / $0.75 per 1M), fp4/int4 or of unlisted precision, none measured,
    # so the filter stays at bf16 until one is.
    # Then Claude Haiku 5.5, with the settings it passed the core suite with as the agent
    # model (22/22 at k = 3): no temperature (no Anthropic endpoint takes one with
    # require_parameters), its own reasoning default, a 2048-token cap. Gemini 2.5 Flash
    # Lite is the last resort: it serves a round when both are down, but loses steps of
    # the loop (evals/RESULTS.md), so a run it finishes is less reliable.
    model: openai/gpt-oss-120b
    fallbacks:
      - model: anthropic/claude-haiku-5.5
        temperature: null
        reasoning_effort: null
        max_tokens: 2048
      - google/gemini-2.5-flash-lite
    temperature: 0
    max_tokens: 4096
    reasoning_effort: low
    provider:
      order: [deepinfra]
      allow_fallbacks: true
      quantizations: [bf16]

  judge:
    # Grades wording only (evals). No fallback: a verdict from another model is not
    # comparable across runs, so a judge outage should fail the eval, not change judges.
    model: openai/gpt-4.1-mini
    fallbacks: []
    temperature: 0
    max_tokens: 1024
    provider:
      order: [openai]
      allow_fallbacks: false

  driver_sim:
    # Plays a driver persona in multi-turn evals; some variety is wanted.
    model: google/gemini-2.5-flash-lite
    fallbacks: [openai/gpt-4.1-nano]
    temperature: 0.7
    max_tokens: 400

  extract:
    # Classifies a document and extracts its values in one call, page images included
    # (scans, phone photos), so a vision model. About $0.0008 per one-page POD.
    model: google/gemini-2.5-flash
    fallbacks: [openai/gpt-4.1-mini]
    temperature: 0
    max_tokens: 4096

# USD per 1M tokens and context length, as listed in the catalog on 2026-10-19.
# cached_input: price of a prompt-cache read (omitted when the catalog lists none, then
# cached tokens cost the input price). The billed price depends on the endpoint
# OpenRouter routes to, so these are estimates for budgets and reports.
pricing:
  openai/gpt-4.1-nano:
    input: 0.10
    output: 0.40
    cached_input: 0.025
    context_length: 1047576
  google/gemini-2.5-flash-lite:
    input: 0.10
    output: 0.40
    cached_input: 0.01
    context_length: 1048576
  openai/gpt-4.1-mini:
    input: 0.40
    output: 1.60
    cached_input: 0.10
    context_length: 1047576
  mistralai/mistral-small-3.2-24b-instruct:
    input: 0.09375
    output: 0.25
    context_length: 256000
  qwen/qwen3-30b-a3b-instruct-2507:
    input: 0.09
    output: 0.30
    context_length: 262144
  # The preferred DeepInfra bf16 endpoint's price (the catalog's model-level price is
  # 0.15 / 0.60); a call another bf16 endpoint serves is billed at that one's price.
  # No cache-read price is listed, so cached tokens cost the input price.
  openai/gpt-oss-120b:
    input: 0.037
    output: 0.17
    context_length: 131072
  # Fetched 2026-10-19. Cache writes cost 0.125; the prompts carry no cache_control.
  anthropic/claude-haiku-5.5:
    input: 0.10
    output: 0.50
    cached_input: 0.01
    context_length: 1000000
  # Not re-checked against the catalog since it was added.
  google/gemini-2.5-flash:
    input: 0.30
    output: 2.50
    cached_input: 0.075
    context_length: 1048576
