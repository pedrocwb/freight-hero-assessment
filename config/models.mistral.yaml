# Bake-off candidate set "mistral" (`--model-set mistral`): the default set with Mistral
# Small 3.2 24B on decide, pinned to DeepInfra then Venice (both fp8; DeepInfra's shared
# pool is often rate-limited). Mistral's own endpoint is EU-only and OpenRouter's
# regional-surcharge filter drops it for this account. Only the decide role differs from
# config/models.yaml; see that file for what each setting means. Prices here are the
# pinned endpoints' (the higher of the two), from the OpenRouter catalog.
# Wave 3 renamed the `decide` role to `agent` (the measurements above ran on decide).

roles:
  gate:
    model: openai/gpt-4.1-nano
    fallbacks: [google/gemini-2.5-flash-lite]
    temperature: 0
    max_tokens: 256
    provider:
      order: [openai]
      allow_fallbacks: false

  agent:
    model: mistralai/mistral-small-3.2-24b-instruct
    fallbacks: [openai/gpt-4.1-mini]
    temperature: 0
    max_tokens: 2048
    provider:
      order: [deepinfra, venice]
      allow_fallbacks: false

  judge:
    model: openai/gpt-4.1-mini
    fallbacks: []
    temperature: 0
    max_tokens: 1024
    provider:
      order: [openai]
      allow_fallbacks: false

  driver_sim:
    model: google/gemini-2.5-flash-lite
    fallbacks: [openai/gpt-4.1-nano]
    temperature: 0.7
    max_tokens: 400

  extract:
    # Wave 3: as in config/models.yaml.
    model: google/gemini-2.5-flash
    fallbacks: [openai/gpt-4.1-mini]
    temperature: 0
    max_tokens: 4096

  compile:
    # Wave 3: as in config/models.yaml.
    model: openai/gpt-4.1-mini
    fallbacks: []
    temperature: 0
    max_tokens: 8192

pricing:
  openai/gpt-4.1-nano: {input: 0.10, output: 0.40, cached_input: 0.025, context_length: 1047576}
  google/gemini-2.5-flash-lite: {input: 0.10, output: 0.40, cached_input: 0.01, context_length: 1048576}
  openai/gpt-4.1-mini: {input: 0.40, output: 1.60, cached_input: 0.10, context_length: 1047576}
  mistralai/mistral-small-3.2-24b-instruct: {input: 0.09375, output: 0.25, context_length: 131072}
  qwen/qwen3-30b-a3b-instruct-2507: {input: 0.10, output: 0.30, context_length: 262144}
  openai/gpt-oss-120b: {input: 0.037, output: 0.17, context_length: 131072}
  # Wave 3; check against the catalog before the bake-off (card W3-BAKE).
  google/gemini-2.5-flash: {input: 0.30, output: 2.50, cached_input: 0.075, context_length: 1048576}
  openai/text-embedding-3-small: {input: 0.02, output: 0, context_length: 8192}

bakeoff_candidates:
  - openai/gpt-4.1-nano
  - google/gemini-2.5-flash-lite
  - mistralai/mistral-small-3.2-24b-instruct
  - qwen/qwen3-30b-a3b-instruct-2507
  - openai/gpt-oss-120b

# The SOP index's embedding model (live and record only). As in config/models.yaml.
embedding:
  model: openai/text-embedding-3-small
  dim: 1536
