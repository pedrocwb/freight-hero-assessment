# UI/proxy only by default. Live operations use compose.temporal.yml.
#   docker compose up -d --build app
#   docker compose --profile studio up -d --build studio  # optional graph debugger
#   docker compose up -d postgres                        # optional integration test DB
# Existing pgdata volumes are retained; nothing here clears old simulator data.
name: freight-agent

services:
  app:
    build:
      context: .
      target: app
    image: freight-agent:local
    # Also supports explicit CLI eval commands via `docker compose exec app agent ...`.
    env_file:
      - path: .env
        required: false
    environment:
      DURABLE_API_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  studio:
    profiles: [studio]
    build:
      context: .
      target: studio
    image: freight-agent-studio:local
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:2024:2024"
    restart: unless-stopped

  # Isolated, optional Postgres for `make integration`; never used by the UI proxy.
  postgres:
    profiles: [tools]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
