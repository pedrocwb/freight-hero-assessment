id: stop_to_pickup
title: ETA and escalation target at to_pickup
suite: grounding
tags: [regression, stop-grounding, sop:delay_risk_high, sop:driver_questions]
description: >
  Ground the operational stop in the load stage. A correct route in the context
  is not enough: outbound text must identify the facility relevant to this stage.
load: fixtures/load_481207.json
load_overrides:
  broker: {id: keystone, name: Keystone Freight}
  stage: to_pickup
date: 2026-10-13
start: "06:55"
steps:
  - at: "07:00"
    ping: {delay_risk: high}
    expect:
      actions:
        - {kind: sms, to: drv_20931, purpose: eta_request, regex: "(?i)(Riverbend|Stockton)", count: 1}
      obligations: {eta_request: {status: open, attempts: 1}}
      timers: {pending: 1, due_at: "07:31"}
      run_status: [acted]
    forbid:
      - {kind: sms, regex: "(?i)(Valley|Reno)"}
  - at: "07:31"
    note: No response. The Slack escalation must identify the same operational stop.
    expect:
      actions:
        - {kind: broker_slack, contains: ["481207"], regex: "(?i)(Riverbend|Stockton)", count: 1}
      obligations: {eta_request: {status: exhausted, attempts: 1}}
      timers: {pending: 0}
      run_status: [acted]
      judge:
        min_score: 1.0
        rubric: >
          The load is at stage to_pickup. The missing ETA being escalated is for
          Riverbend plant in Stockton (pickup). The Slack alert must unambiguously identify that facility
          as the ETA target, not merely list it as part of the route.
          Any claim that the other stop is the ETA target fails this rubric.
    forbid:
      - {kind: broker_slack, regex: "(?i)(Valley|Reno)"}
      - {kind: sms}
      - {kind: email, to: dsp_4410}
