id: stop_after_pickup_departure
title: After pickup departure the next ETA and escalation target the delivery
suite: grounding
tags: [regression, stop-grounding, sop:driver_departed, sop:delay_risk_high, sop:driver_questions]
description: >
  The same load first answers about pickup, then departs it. A later location ping
  must ask for the delivery ETA, even though the transcript still names the pickup.
load: fixtures/load_481207.json
load_overrides:
  broker: {id: keystone, name: Keystone Freight}
  stage: at_pickup
date: 2026-10-13
start: "06:55"
steps:
  - at: "07:00"
    message:
      channel: sms
      sender: drv_20931
      body: Please confirm the name and city of the facility where I am currently checked in.
    expect:
      actions:
        - {kind: sms, to: drv_20931, purpose: reply, regex: "(?i)(Riverbend|Stockton)", count: 1}
    forbid:
      - {kind: sms, regex: "(?i)(Valley|Reno)"}
  - at: "07:05"
    message: {channel: sms, sender: drv_20931, body: "Loaded, just left the pickup."}
    expect:
      actions:
        - {kind: stage_update, stage: to_delivery, count: 1}
        - {kind: tms_note, count: 1}
  - at: "07:10"
    ping: {delay_risk: high}
    expect:
      actions:
        - {kind: sms, to: drv_20931, purpose: eta_request, regex: "(?i)(Valley|Reno)", count: 1}
      obligations: {eta_request: {status: open, attempts: 1}}
      timers: {pending: 1, due_at: "07:41"}
    forbid:
      - {kind: sms, regex: "(?i)(Riverbend|Stockton)"}
  - at: "07:41"
    expect:
      actions:
        - {kind: broker_slack, contains: ["481207"], regex: "(?i)(Valley|Reno)", count: 1}
      obligations: {eta_request: {status: exhausted, attempts: 1}}
      timers: {pending: 0}
      judge:
        min_score: 1.0
        rubric: >
          The truck has left the pickup and is now to_delivery. The Slack alert must
          identify Valley DC in Reno as the destination whose ETA is missing.
          It must not ask for arrival back at Riverbend plant in Stockton.
    forbid:
      - {kind: broker_slack, regex: "(?i)(Riverbend|Stockton)"}
      - {kind: sms}
      - {kind: email, to: dsp_4410}
