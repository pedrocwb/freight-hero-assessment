# D1: Client B (Keystone Freight) replaces the high-risk procedure: one SMS, then the
# broker's Slack channel. The dispatcher is never contacted.
#
# Expected timeline (Client B, load 481207 with broker keystone, 2026-10-13,
# America/Los_Angeles):
#   step 0  07:00  ping, risk low -> high.
#           07:01  run: intent delay_risk_high from code, decide only. The keystone
#                  section replaces the standard one: one SMS to drv_20931 for the ETA
#                  (eta_request opens, attempts 1) and a follow-up timer due 07:31.
#   step 1  07:31  the timer fires (zero latency): intent eta_follow_up_due, decide only.
#                  Keystone: no ETA after 30 minutes means one alert in the broker's Slack
#                  channel, and the procedure is over: close eta_request as exhausted.
#                  No second SMS and no email to the dispatcher.
#   step 2  08:05  nothing is pending: no SMS, no email to dsp_4410 (Client A would email
#                  the dispatcher here).
id: d1_keystone_high_risk
title: Client B high risk, one SMS then a broker Slack alert, never the dispatcher
suite: core
tags: [regression, sop:delay_risk_high]
description: >
  The same load and the same events as the assignment's scenario, for another client.
  Only the client's SOP section changes, and the agent's behavior follows it: one SMS,
  a broker Slack alert after 30 minutes, the request closed as exhausted, and no contact
  with the dispatcher at any point.
load: fixtures/load_481207.json
load_overrides:
  broker: {id: keystone, name: Keystone Freight}
date: 2026-10-13
start: "06:55"
steps:
  - at: "07:00"
    note: Risk goes high; one SMS to the driver at 07:01.
    ping: {delay_risk: high}
    script:
      decide:
        - actions:
            - type: send_sms
              contact_id: drv_20931
              purpose: eta_request
              text: Hi, this is Keystone Freight for load 481207. What time will you arrive at Riverbend plant in Stockton?
            - {type: schedule_timer, kind: eta_request, due_in_minutes: 30}
          rationale: delay_risk_high (keystone), send one SMS to the driver and alert the broker's Slack if there is no ETA in 30 minutes.
    expect:
      actions:
        - {kind: sms, to: drv_20931, count: 1}
      obligations:
        eta_request: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "07:31"}
      llm_calls: 1
    forbid:
      - {kind: email, to: dsp_4410}

  - at: "07:31"
    note: No ETA after 30 minutes; alert the broker's Slack channel and stop.
    script:
      decide:
        - actions:
            - type: post_broker_slack
              text: "Load 481207: delay risk is high for the Riverbend plant pickup and the driver has not answered our ETA request sent at 07:01."
            - {type: close_obligation, kind: eta_request, status: exhausted}
          rationale: delay_risk_high (keystone), no ETA 30 minutes after the one SMS, so alert the broker's Slack channel; the procedure is used up.
    expect:
      actions:
        - {kind: broker_slack, count: 1}
      obligations:
        eta_request: {status: exhausted, attempts: 1}
      timers: {pending: 0}
      llm_calls: 1
    forbid:
      - {kind: sms}
      - {kind: email, to: dsp_4410}

  - at: "08:05"
    note: Nothing more; Client B never emails the dispatcher.
    expect:
      no_actions: true
      obligations:
        eta_request: {status: exhausted, attempts: 1}
      timers: {pending: 0}
      llm_calls: 0
    forbid:
      - {kind: sms}
      - {kind: email, to: dsp_4410}
