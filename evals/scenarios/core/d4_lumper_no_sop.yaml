# D4: a situation no SOP covers. The driver asks who pays a lumper in cash. No section
# says who pays lumpers, and the load details do not say either, so the agent must not
# improvise an answer: it hands the question to a Hero.
#
# Expected timeline (Client A, load 481207 at_delivery, 2026-10-14, America/Los_Angeles):
#   step 0  09:40  driver SMS "lumper wants cash to unload, who pays?".
#           09:41  run: gate -> question (it asks us something) -> agent.
#                  driver_questions: the answer is not in the load details, so do not
#                  guess and do not reply with a promise; create a Hero task with the
#                  question, who asked and what they need. escalation lists questions
#                  about pay as Hero work, and communication_rules forbids promising a
#                  payment. One Hero task; no SMS may say that anyone will pay.
#
# Live note: a gate that reads the message as `other` gives the agent no section with
# an explicit intent; the agent may search the SOP, find nothing and answer
# no_procedure, and the run hands the event to a Hero ("No SOP for this situation").
# Both paths end in one Hero task, so the expectations hold for both; run_status and
# llm_calls differ and are not asserted.
id: d4_lumper_no_sop
title: A lumper payment question no SOP answers goes to a Hero, with no promise
suite: core
tags: [capability, sop:driver_questions, sop:escalation, sop:communication_rules]
description: >
  The agent must know what it does not know. Lumper payment is not in any SOP or in the
  load details; the right action is a Hero task, and the driver must not be told that
  anyone will pay.
load: fixtures/load_481207.json
load_overrides:
  stage: at_delivery
date: 2026-10-14
start: "09:30"
steps:
  - at: "09:40"
    note: The driver is at the receiver and the lumper asks for cash.
    message: {channel: sms, sender: drv_20931, body: "lumper wants cash to unload, who pays?"}
    expect:
      actions:
        - {kind: hero_task, count: 1}
      obligations:
        eta_request: null
    forbid:
      - {kind: sms, regex: '\b(will|''ll|going to)\s+(be\s+)?(pay|cover|reimburs)'}
      - {kind: sms, regex: '\bgo ahead\b[^.?!]{0,20}\bpay'}
      - {kind: sms, regex: '\b(approved|authori[sz]ed)\b'}
      - {kind: email}
