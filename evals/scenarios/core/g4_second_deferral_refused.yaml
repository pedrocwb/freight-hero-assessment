# G4: a second deferral on the same request is not accepted. The policy allows one
# deferral per ETA request; the validator drops the second, and the SOP cadence goes on.
#
# Expected timeline (Client A, load 481207, 2026-10-13, America/Los_Angeles):
#   step 0  07:00  ping, risk low -> high.
#           07:01  run: SMS to drv_20931 for the ETA (attempts 1), timer T1 due 07:31.
#   step 1  07:30  driver SMS "I'll tell you in 5 minutes".
#           07:31  one tick: T1 fires (queued behind the message); the message run defers
#                  until 07:35 (deferrals used 1) and replaces T1 with T2 due 07:37; T1's
#                  run is skipped as stale. Nothing is sent. (See G1 for the detail.)
#   step 2  07:33  driver SMS "give me 10 more minutes".
#           07:34  run: gate -> eta_deferred -> agent. eta_deferred rule 2: this request
#                  already used its one wait, so send nothing and change nothing.
#                  A careful model stages nothing: status noop. A model that does not
#                  count deferrals stages defer_obligation 10 minutes; the tool refuses it
#                  at the call (deferral_policy), so nothing is approved: also noop.
#                  Either way the ledger keeps one deferral and T2 stays at 07:37 (an
#                  accepted second deferral would have moved it to 07:45).
#   step 3  07:37  T2 fires: Northline's next step, the second ETA SMS (attempts 2) and a
#                  timer due max(08:07, 07:35 + 2 min) = 08:07.
id: g4_second_deferral_refused
title: A second deferral is refused and the follow-up still runs at 07:37
suite: core
tags: [regression, sop:delay_risk_high, sop:eta_deferred]
description: >
  A driver cannot push the ETA request back again and again. Code enforces the
  one-deferral limit, whatever the model proposes, and the SOP's next step runs on time.
load: fixtures/load_481207.json
date: 2026-10-13
start: "06:55"
steps:
  - at: "07:00"
    note: Risk goes high; the agent asks the driver for the ETA at 07:01.
    ping: {delay_risk: high}
    expect:
      actions:
        - {kind: sms, to: drv_20931, purpose: eta_request, count: 1}
      obligations:
        eta_request: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "07:31"}
      run_status: [acted]
      llm_calls: 1

  - at: "07:30"
    note: First deferral, accepted; the 07:31 timer becomes stale.
    message: {channel: sms, sender: drv_20931, body: "I'll tell you in 5 minutes"}
    expect:
      no_actions: true
      obligations:
        eta_request: {status: open, attempts: 1, deferred: true}
      timers: {pending: 1, due_at: "07:37"}
      run_status: [acted, skipped]

  - at: "07:33"
    note: Second deferral. The validator drops it; nothing changes.
    message: {channel: sms, sender: drv_20931, body: "give me 10 more minutes"}
    expect:
      no_actions: true
      obligations:
        eta_request: {status: open, attempts: 1, deferred: true}
      timers: {pending: 1, due_at: "07:37"}
      run_status: [noop]

  - at: "07:37"
    note: The follow-up runs on the first deferral's schedule; second ETA request.
    expect:
      actions:
        - {kind: sms, to: drv_20931, purpose: eta_request, count: 1}
      obligations:
        eta_request: {status: open, attempts: 2, deferred: true}
      timers: {pending: 1, due_at: "08:07"}
      run_status: [acted]
      llm_calls: 1
