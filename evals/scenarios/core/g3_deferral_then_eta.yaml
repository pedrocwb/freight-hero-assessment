# G3: the driver defers and keeps the promise: the ETA arrives at 07:34, before the
# moved follow-up. The request closes and the 07:37 timer is cancelled.
#
# Expected timeline (Client A, load 481207, 2026-10-13, America/Los_Angeles):
#   step 0  07:00  ping, risk low -> high.
#           07:01  run: SMS to drv_20931 for the ETA (attempts 1), timer T1 due 07:31.
#   step 1  07:30  driver SMS "I'll tell you in 5 minutes".
#           07:31  one tick: T1 fires (queued behind the message); the message run defers
#                  until 07:35 and replaces T1 with T2 due 07:37; T1's run is skipped as
#                  stale. Nothing is sent. (See G1 for the detail.)
#   step 2  07:34  driver SMS "ok be there at 9:15".
#           07:35  run: gate -> eta_provided, decide. eta_received: close eta_request as
#                  satisfied, write the ETA in the TMS, send no reply. Closing cancels T2.
#   step 3  07:37  T2 was cancelled, so it never fires: no run, no second ETA request.
id: g3_deferral_then_eta
title: A deferral followed by the ETA at 07:34 closes the request and cancels the timer
suite: core
tags: [regression, sop:delay_risk_high, sop:eta_deferred, sop:eta_received]
description: >
  The promised answer arrives inside the deferral. The request closes as satisfied and
  the moved follow-up never fires.
load: fixtures/load_481207.json
date: 2026-10-13
start: "06:55"
steps:
  - at: "07:00"
    note: Risk goes high; the agent asks the driver for the ETA at 07:01.
    ping: {delay_risk: high}
    script:
      decide:
        - actions:
            - type: send_sms
              contact_id: drv_20931
              purpose: eta_request
              text: Hi, this is Northline Logistics. What time will you arrive at the Riverbend plant pickup in Stockton?
            - {type: schedule_timer, kind: eta_request, due_in_minutes: 30}
          rationale: delay_risk_high (Northline), first step, no ETA request is open, so SMS the driver for the ETA and follow up in 30 minutes.
    expect:
      actions:
        - {kind: sms, to: drv_20931, purpose: eta_request, count: 1}
      obligations:
        eta_request: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "07:31"}
      run_status: [acted]
      llm_calls: 1

  - at: "07:30"
    note: The driver defers; the 07:31 timer becomes stale.
    message: {channel: sms, sender: drv_20931, body: "I'll tell you in 5 minutes"}
    script:
      gate:
        - {intent: eta_deferred, act: true, reason: The driver promises the ETA in 5 minutes.}
      decide:
        - actions:
            - {type: defer_obligation, kind: eta_request, minutes: 5}
          rationale: eta_deferred, first wait for this request, so defer it by the 5 minutes promised and send nothing; code moves the follow-up.
    expect:
      no_actions: true
      obligations:
        eta_request: {status: open, attempts: 1, deferred: true}
      timers: {pending: 1, due_at: "07:37"}
      run_status: [acted, skipped]

  - at: "07:34"
    note: The driver keeps the promise; the run at 07:35 closes the request.
    message: {channel: sms, sender: drv_20931, body: "ok be there at 9:15"}
    script:
      gate:
        - {intent: eta_provided, act: true, reason: The driver gives the arrival time he promised.}
      decide:
        - actions:
            - {type: close_obligation, kind: eta_request, status: satisfied}
            - {type: write_tms_note, text: "ETA 09:15 at the Riverbend plant pickup (driver, by SMS at 07:34)."}
          rationale: eta_received, close the ETA request as satisfied, record the ETA in the TMS and send no reply.
    expect:
      actions:
        - {kind: tms_note, contains: ["9:15"], count: 1}
      obligations:
        eta_request: {status: satisfied, attempts: 1}
      timers: {pending: 0}
    forbid:
      - {kind: sms}
      - {kind: hero_task}

  - at: "07:37"
    note: The cancelled follow-up never fires.
    expect:
      no_actions: true
      timers: {pending: 0}
      runs: 0
      llm_calls: 0
