# Scenario A, variant: the driver's question comes during the last wait, after the
# second ETA request (Client A, broker id `northline`, load 481207).
#
# What the full scenario does not test. At 07:46 the ETA request has used both of its
# attempts, and the procedure in progress says the next step is "email the dispatcher,
# then a Hero task". That step belongs to the 08:01 timer, not to this question, so:
#   - the answer goes out as a reply. Labelled as an ETA request, it would be dropped by
#     the validator (eta_attempt_cap: 2 of 2 used), and the driver would get no PO;
#   - nothing is escalated early, and the ledger and the 08:01 timer do not change;
#   - at 08:01 the escalation still happens. The driver did write since the last
#     request, but a question is not an ETA.
#
# Timing (docs/decisions.md, "Eval timing"): the run of an injected event happens 60 s
# after it; timers fire with zero latency. Times are America/Los_Angeles, 2026-10-13.
# Only inbound messages call the gate model.
#
# Step 0, 07:00. Ping, delay risk low -> high (intent delay_risk_high, from code).
#   07:01 run 1: acted, 1 model call (decide).
#   Plan: send_sms(drv_20931, eta_request) + schedule_timer(eta_request, 30).
#   After: eta_request open, attempts 1. Pending timers: T1 at 07:31.
#
# Step 1, 07:31. No injection: T1 fires.
#   07:31 run 2 (timer_due, eta_follow_up_due): acted, 1 model call (decide).
#   Plan: send_sms(drv_20931, eta_request) + schedule_timer(eta_request, 30).
#   After: eta_request open, attempts 2. Pending timers: T2 at 08:01.
#
# Step 2, 07:45. SMS from the driver: "What's the PO number?".
#   07:46 run 3: acted, 2 model calls (gate: question, act; then decide).
#   Plan: send_sms(drv_20931, purpose reply) with the PO 55821. Nothing else.
#   SMS rate: 2 SMS to the driver in the last 60 minutes, under the limit of 3.
#   After: eta_request open, attempts 2. Pending timers: T2 at 08:01.
#
# Step 3, 08:01. No injection: T2 fires.
#   08:01 run 4 (timer_due, eta_follow_up_due): acted, 1 model call (decide).
#   Plan: send_email(to dsp_4410) + create_hero_task(call the driver) +
#   close_obligation(eta_request, exhausted).
#   After: eta_request exhausted, attempts 2. No pending timer.

id: a_question_during_last_wait
title: "A variant: the driver asks for the PO after the second ETA request"
suite: core
tags: [regression, sop:delay_risk_high, sop:driver_questions, sop:escalation]
description: >-
  A question answered while the last wait runs is a reply, not an ETA request: it is not
  blocked by the attempt cap, it does not start the escalation early, and it does not stop
  the escalation at 08:01.
load: fixtures/load_481207.json
date: 2026-10-13
start: "06:55"

steps:
  - at: "07:00"
    note: "The risk goes high; at 07:01 the first ETA request and a 30-minute timer"
    ping: {delay_risk: high}
    expect:
      actions:
        - {kind: sms, to: drv_20931, count: 1}
      obligations:
        eta_request: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "07:31"}
      run_status: [acted]
      llm_calls: 1
    script:
      decide:
        - rationale: >-
            delay_risk_high (Northline), first step: text the driver for the ETA and follow
            up in 30 minutes.
          actions:
            - type: send_sms
              contact_id: drv_20931
              purpose: eta_request
              text: "Hi, this is Northline Logistics. What time will you arrive at the Riverbend plant pickup in Stockton?"
            - type: schedule_timer
              kind: eta_request
              due_in_minutes: 30

  - at: "07:31"
    note: "No ETA after 30 minutes: the second ETA request and a new 30-minute timer"
    expect:
      actions:
        - {kind: sms, to: drv_20931, count: 1}
      obligations:
        eta_request: {status: open, attempts: 2}
      timers: {pending: 1, due_at: "08:01"}
      run_status: [acted]
      llm_calls: 1
    script:
      decide:
        - rationale: >-
            delay_risk_high (Northline), second step: no ETA 30 minutes after the first
            request, so text the driver again and wait 30 more minutes.
          actions:
            - type: send_sms
              contact_id: drv_20931
              purpose: eta_request
              text: "Following up from Northline Logistics: what time will you arrive at the Riverbend plant pickup?"
            - type: schedule_timer
              kind: eta_request
              due_in_minutes: 30

  - at: "07:45"
    note: "The driver asks for the PO with both requests used; at 07:46 only the answer goes out"
    message:
      channel: sms
      sender: drv_20931
      body: "What's the PO number?"
    expect:
      actions:
        - {kind: sms, count: 1}
        - {kind: sms, to: drv_20931, contains: ["55821"], count: 1}
      obligations:
        eta_request: {status: open, attempts: 2}
      timers: {pending: 1, due_at: "08:01"}
      run_status: [acted]
      llm_calls: 2
    forbid:
      - {kind: email}
      - {kind: hero_task}
    script:
      gate:
        - {intent: question, act: true, reason: "The driver asks for the PO number."}
      decide:
        - rationale: >-
            driver_questions: the PO is in the load instructions, so answer it. The ETA
            request has its follow-up timer at 08:01; its next step is not for this event.
          actions:
            - type: send_sms
              contact_id: drv_20931
              purpose: reply
              text: "The PO number is 55821. You will need it at the gate."

  - at: "08:01"
    note: "Still no ETA after two requests: email the dispatcher, then a Hero task"
    expect:
      actions:
        - {kind: email, to: dsp_4410, count: 1}
        - {kind: hero_task, count: 1}
      obligations:
        eta_request: {status: exhausted, attempts: 2}
      timers: {pending: 0}
      run_status: [acted]
      llm_calls: 1
    forbid:
      - {kind: sms}
    script:
      decide:
        - rationale: >-
            delay_risk_high (Northline), last step: two ETA requests and no ETA (the driver
            only asked for the PO), so email the dispatcher in the main thread, then create
            a Hero task, and close the request as exhausted.
          actions:
            - type: send_email
              to_contact_ids: [dsp_4410]
              purpose: escalation
              subject: "Load 481207: driver ETA needed for the Riverbend plant pickup"
              body: |-
                Hello,

                We texted your driver at 07:01 and 07:31 for an ETA to the Riverbend plant pickup in Stockton and have no ETA yet. Please send us the driver's ETA as soon as you can.

                Thank you,
                Northline Logistics operations
            - type: create_hero_task
              title: "Call the driver for the ETA"
              urgent: true
              description: >-
                Load 481207 (Northline Logistics). The delay risk for the Riverbend plant
                pickup in Stockton (window 06:00 to 14:00) went high at 07:00. The driver
                got ETA texts at 07:01 and 07:31; at 07:45 the driver asked for the PO
                number and got it, but never gave an ETA. The dispatcher at Prairie Haul
                was emailed for the ETA at 08:01. Call the driver, get the ETA and record
                it on the load.
            - type: close_obligation
              kind: eta_request
              status: exhausted
