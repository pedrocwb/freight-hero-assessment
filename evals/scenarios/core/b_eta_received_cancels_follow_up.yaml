# Scenario B3: the ETA arrives before the follow-up, so at 07:31 nothing happens
# (load 481207, Client A).
#
# When not to act, by memory: the 07:31 follow-up belonged to the ETA request, and the
# request was closed at 07:21. Closing it cancelled its timer, so at 07:31 there is no
# timer to fire, no run and no model call.
#
# Timing (docs/decisions.md, "Eval timing"): the run of an injected event happens 60 s
# after it; timers fire with zero latency. Times are America/Los_Angeles, 2026-10-13.
# Only inbound messages call the gate model.
#
# Step 0, 07:00. Ping, delay risk low -> high (intent delay_risk_high, from code).
#   07:01 run 1: acted, 1 model call (agent).
#   Plan: send_sms(drv_20931, eta_request) + schedule_timer(eta_request, 30).
#   After: eta_request open, attempts 1. Pending timers: T1 at 07:31.
#
# Step 1, 07:20. SMS from the driver: "Should be there around 8:15".
#   07:21 run 2: acted, 2 model calls (gate: eta_provided, act; then agent). The
#   `eta_received` section applies: close the request as satisfied and write the ETA, as
#   a local clock time, in the TMS. It asks for no message.
#   Plan: close_obligation(eta_request, satisfied) + write_tms_note(ETA 08:15).
#   The close marks T1 cancelled.
#   After: eta_request satisfied, attempts 1. No pending timer (T1 cancelled).
#
# Step 2, 07:31. No injection. The runner advances the clock to 07:31 and stops only at
#   pending timers; T1 is cancelled, so nothing fires and the runtime never ticks.
#   No run, no model call, no outbox item. The ledger is unchanged.
#   (Were a cancelled timer to fire anyway, the prefilter would skip its run as
#   stale_timer, with no model call and no action, and `runs: 0` would catch it.)

id: b_eta_received_cancels_follow_up
title: "B3: the ETA arrives at 07:20, so the 07:31 follow-up never runs"
suite: core
tags: [regression, sop:eta_received, sop:delay_risk_high]
description: >-
  An ETA closes the request as satisfied, writes the ETA in the TMS and cancels the
  follow-up timer; at 07:31 nothing fires and no model is called.
load: fixtures/load_481207.json
date: 2026-10-13
start: "06:55"

steps:
  - at: "07:00"
    note: "The risk goes high; at 07:01 the ETA request and a 30-minute timer"
    ping: {delay_risk: high}
    expect:
      actions:
        - {kind: sms, to: drv_20931, count: 1}
      obligations:
        eta_request: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "07:31"}
      run_status: [acted]
      llm_calls: 1

  - at: "07:20"
    note: "The driver gives the ETA; at 07:21 the request closes as satisfied and the ETA goes in the TMS"
    message:
      channel: sms
      sender: drv_20931
      body: "Should be there around 8:15"
    expect:
      actions:
        - {kind: tms_note, contains: ["8:15"], count: 1}
      obligations:
        eta_request: {status: satisfied, attempts: 1}
      timers: {pending: 0}
      run_status: [acted]
      llm_calls: 2
    forbid:
      - {kind: sms}
      - {kind: email}
      - {kind: hero_task}

  - at: "07:31"
    note: "B3: the follow-up was cancelled, so nothing fires: no run, no model call, no action"
    expect:
      no_actions: true
      obligations:
        eta_request: {status: satisfied, attempts: 1}
      timers: {pending: 0}
      llm_calls: 0
      runs: 0
