# D2: Client B refrigerated load. The load-type layer extends the standard departure
# section: also ask the driver for the trailer temperature and the seal number.
#
# Expected timeline (Client B reefer, load 481207 at_pickup, 2026-10-13,
# America/Los_Angeles):
#   step 0  09:05  driver SMS "loaded, leaving the shipper now".
#           09:06  run: gate -> driver_departed, decide. driver_departed is the standard
#                  body plus the keystone/types/reefer extension: set the stage
#                  at_pickup -> to_delivery (the next stop is a delivery), write a TMS
#                  note with the stop and the local time, and send the driver one SMS
#                  that asks for both the temperature and the seal number. No ETA
#                  request is open, so there is nothing to close.
#   step 1  09:12  driver SMS "34F, seal 4471902".
#           09:13  run: gate -> status_update, decide. status_updates: a trailer
#                  temperature and a seal number matter, so write them in a TMS note
#                  (the reefer extension says the same). Send no reply; the stage stays.
id: d2_keystone_reefer_departure
title: Client B reefer departure asks the driver for the temperature and the seal
suite: core
tags: [regression, sop:driver_departed, sop:status_updates]
description: >
  The same event (the driver leaves the pickup) gets one more step on a Client B reefer
  load, because a load-type SOP file extends the standard section. The driver's answer
  is recorded in the TMS.
load: fixtures/load_481207.json
load_overrides:
  broker: {id: keystone, name: Keystone Freight}
  load_types: [reefer]
  stage: at_pickup
  commodity: Fresh produce, 40,000 lb, reefer set at 34 F
date: 2026-10-13
start: "09:00"
steps:
  - at: "09:05"
    note: The driver leaves the shipper; the run at 09:06 moves the stage and asks for the reefer values.
    message: {channel: sms, sender: drv_20931, body: "loaded, leaving the shipper now"}
    expect:
      actions:
        - {kind: stage_update, stage: to_delivery, count: 1}
        - {kind: tms_note, count: 1}
        - {kind: sms, to: drv_20931, contains: [temperature, seal], count: 1}
      obligations:
        eta_request: null
      timers: {pending: 0}
    forbid:
      - {kind: sms, purpose: eta_request}
      - {kind: email}
      - {kind: broker_slack}

  - at: "09:12"
    note: The driver sends the values; they go to the TMS and nothing is sent.
    message: {channel: sms, sender: drv_20931, body: "34F, seal 4471902"}
    expect:
      actions:
        - {kind: tms_note, contains: ["4471902"], count: 1}
      obligations:
        eta_request: null
    forbid:
      - {kind: stage_update}
      - {kind: sms}
      - {kind: email}
