# C3 (vague): "soon" is not an ETA. The request stays open and the follow-up still runs.
#
# Expected timeline (Client A, load 481207, 2026-10-13, America/Los_Angeles):
#   step 0  07:00  ping, risk low -> high.
#           07:01  run: SMS to drv_20931 for the ETA (eta_request opens, attempts 1),
#                  follow-up timer due 07:31.
#   step 1  07:20  driver SMS "on my way, there soon".
#           07:21  run: gate -> eta_provided (the gate leaves "is it precise enough?" to the
#                  ETA procedure), decide -> eta_received says a vague answer is not an
#                  ETA: send nothing, keep the request open. Empty plan, nothing sent.
#                  The ledger and the 07:31 timer are unchanged.
#   step 2  07:31  the timer fires (zero latency): intent eta_follow_up_due from code,
#                  decide only. Client A step 2: SMS the driver again (attempts 2) and
#                  wait 30 more minutes (timer due 08:01).
id: c3_vague_eta
title: A vague answer ("soon") keeps the ETA request open and the follow-up runs
suite: core
tags: [regression, sop:delay_risk_high, sop:eta_received]
description: >
  The agent must not close the request on an answer with no time in it. Nothing is sent
  at 07:21, and the 07:31 follow-up still asks again.
load: fixtures/load_481207.json
date: 2026-10-13
start: "06:55"
steps:
  - at: "07:00"
    note: Risk goes high; the agent asks the driver for the ETA at 07:01.
    ping: {delay_risk: high}
    script:
      decide:
        - actions:
            - type: send_sms
              contact_id: drv_20931
              purpose: eta_request
              text: Hi, this is Northline Logistics for load 481207. What time will you arrive at Riverbend plant in Stockton?
            - {type: schedule_timer, kind: eta_request, due_in_minutes: 30}
          rationale: delay_risk_high (northline) step 1, SMS the driver for the ETA and wait 30 minutes.
    expect:
      actions:
        - {kind: sms, to: drv_20931, count: 1}
      obligations:
        eta_request: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "07:31"}
      llm_calls: 1

  - at: "07:20"
    note: A vague reply. Not an ETA; send nothing.
    message: {channel: sms, sender: drv_20931, body: "on my way, there soon"}
    script:
      gate:
        - {intent: eta_provided, act: true, reason: A vague reply to our ETA request; the ETA procedure judges it.}
      decide:
        - actions: []
          rationale: eta_received, "soon" is not an ETA, so send nothing and keep the request open; the 07:31 follow-up continues.
    expect:
      obligations:
        eta_request: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "07:31"}
    forbid:
      - {kind: sms}
      - {kind: email}
      - {kind: broker_slack}
      - {kind: hero_task}

  - at: "07:31"
    note: The follow-up timer fires as planned; second ETA request.
    script:
      decide:
        - actions:
            - type: send_sms
              contact_id: drv_20931
              purpose: eta_request
              text: Following up on load 481207. What time will you arrive at Riverbend plant? Please send a time.
            - {type: schedule_timer, kind: eta_request, due_in_minutes: 30}
          rationale: delay_risk_high (northline) step 2, no ETA 30 minutes after the first SMS, so SMS again and wait 30 minutes.
    expect:
      actions:
        - {kind: sms, to: drv_20931, count: 1}
      obligations:
        eta_request: {status: open, attempts: 2}
      timers: {pending: 1, due_at: "08:01"}
      llm_calls: 1
    forbid:
      - {kind: email}
      - {kind: hero_task}
