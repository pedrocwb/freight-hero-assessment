# C1: the driver answers the ETA request, and the loop closes.
#
# Expected timeline (Client A, load 481207, 2026-10-13, America/Los_Angeles):
#   step 0  07:00  ping, risk low -> high (one confirmation is enough for an upgrade).
#           07:01  run (60 s latency): intent delay_risk_high from code, decide only.
#                  Northline delay_risk_high, first step: SMS to drv_20931 for the ETA
#                  (opens eta_request, attempts 1), follow-up timer T1 due 07:31.
#   step 1  07:15  driver SMS "be there at 9:40".
#           07:16  run: gate -> eta_provided, decide. eta_received: close eta_request as
#                  satisfied, write a TMS note with the ETA as a local clock time, send no
#                  reply. Closing cancels T1.
#   step 2  07:31  nothing is pending, so nothing fires: no run, no second SMS. With no
#                  timer left, the 08:01 email and Hero task of the Client A procedure
#                  cannot happen either.
id: c1_eta_from_driver
title: The driver sends an ETA after the first SMS; the request closes as satisfied
suite: core
tags: [regression, sop:delay_risk_high, sop:eta_received]
description: >
  Closing the loop. An ETA from the driver ends the high-risk procedure: the ledger
  closes the request as satisfied, the ETA goes to the TMS and the follow-up timer is
  cancelled, so the 07:31 reminder never goes out.
load: fixtures/load_481207.json
date: 2026-10-13
start: "06:55"
steps:
  - at: "07:00"
    note: Risk goes high; the agent asks the driver for the ETA at 07:01.
    ping: {delay_risk: high}
    expect:
      actions:
        - {kind: sms, to: drv_20931, purpose: eta_request, count: 1}
      obligations:
        eta_request: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "07:31"}
      run_status: [acted]
      llm_calls: 1

  - at: "07:15"
    note: The driver answers with a clock time; the run at 07:16 closes the request.
    message: {channel: sms, sender: drv_20931, body: "be there at 9:40"}
    expect:
      actions:
        - {kind: tms_note, contains: ["9:40"], count: 1}
      obligations:
        eta_request: {status: satisfied, attempts: 1}
      timers: {pending: 0}
    forbid:
      - {kind: sms}
      - {kind: email}
      - {kind: hero_task}

  - at: "07:31"
    note: The cancelled timer never fires; no reminder SMS.
    expect:
      no_actions: true
      obligations:
        eta_request: {status: satisfied, attempts: 1}
      timers: {pending: 0}
      runs: 0
      llm_calls: 0
