# P3: the POD is overdue. Acme's POD request: due 120 minutes after the arrival, one
# reminder SMS (`ObligationDef pod`: max_attempts 1, follow-up 30 min), then a Hero task
# to get the POD from the carrier (proof_of_delivery, steps 2 and 3).
#
# Cards: W3-AGT (the requirement timer, `requests: pod` counts an attempt, the attempt cap
# per kind, the follow-up intent `pod_follow_up_due` from the catalog).
#
# Expected timeline (Acme, load 481207 to_delivery, 2026-10-14, America/Los_Angeles):
#   step 0  09:10  arrival: at_delivery; `pod` open, attempts 0, timer at 11:11.
#   step 1  11:11  the POD timer fires (pod_follow_up_due, one agent call): one SMS asks
#                  the driver for a photo of the signed POD (`requests: pod`, attempt 1)
#                  and a 30-minute follow-up at 11:41.
#   step 2  11:41  the follow-up fires with the one attempt used: a Hero task to get the
#                  POD from the carrier (not urgent), and the request closes exhausted.
#                  No second SMS.
# The judge reads the reminder SMS (Acme's communication rules: polite, plain, short).
id: p3_pod_overdue_follow_up
title: "An overdue POD gets one reminder SMS, then a Hero task (Acme)"
suite: docs
tags: [regression, sop:proof_of_delivery, sop:communication_rules]
description: >-
  No POD 120 minutes after the arrival: one polite reminder to the driver that requests
  the POD, then, 30 minutes later with still no POD, a Hero task and the request closed
  as exhausted.
load: fixtures/load_481207.json
load_overrides:
  broker: {id: acme, name: Acme Freight}
  stage: to_delivery
date: 2026-10-14
start: "09:00"
steps:
  - at: "09:10"
    note: "Arrival at Valley DC: the POD becomes due at 11:11"
    message: {channel: sms, sender: drv_20931, body: "checked in at valley dc, they are unloading us now"}
    expect:
      obligations:
        pod: {status: open, attempts: 0}
      timers: {pending: 1, due_at: "11:11"}

  - at: "11:11"
    note: "120 minutes and no POD: one reminder SMS and a 30-minute follow-up"
    expect:
      intent: pod_follow_up_due
      tools_used: [send_sms, schedule_timer]
      max_rejections: 0
      actions:
        - {kind: sms, to: drv_20931, contains: ["POD"], count: 1}
      obligations:
        pod: {status: open, attempts: 1}
      timers: {pending: 1, due_at: "11:41"}
      run_status: [acted]
      llm_calls: 1
      judge:
        rubric: |-
          1. The SMS to the driver is polite and plain, written as Acme dispatch.
          2. It asks for a photo of the signed POD.
          3. It is short (under 160 characters) and mentions no Hero team, automation or internal tool.
        min_score: 0.7
    forbid:
      - {kind: hero_task}
      - {kind: email}

  - at: "11:41"
    note: "Still no POD after the reminder: a Hero task, and the request closes"
    expect:
      intent: pod_follow_up_due
      actions:
        - {kind: hero_task, urgent: false, count: 1}
      obligations:
        pod: {status: exhausted, attempts: 1}
      timers: {pending: 0}
      llm_calls: 1
    forbid:
      - {kind: sms}
      - {kind: email}
