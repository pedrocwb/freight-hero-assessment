# P2: a POD with exceptions and a wrong PO goes to a Hero; the load is not delivered.
# The fixture pod_exceptions.pdf lists "2 cases damaged, 1 short" and PO 55812, while the
# load's PO is 55821: the pipeline's po_number check fails, so the document is
# `needs_review` and the `pod` obligation stays open (docs/decisions.md, "Documents").
# Acme's proof_of_delivery section, step 5: a Hero task with the values found and what
# does not match, no stage change, nothing to the driver.
#
# Cards: W3-DOC (checks in code, needs_review leaves the obligation open) and W3-AGT.
#
# Expected timeline (Acme, load 481207 to_delivery, 2026-10-14, America/Los_Angeles):
#   step 0  09:10  arrival, as in p1: at_delivery, `pod` open with its timer at 11:11.
#   step 1  09:50  POD photo, no text.
#           09:51  extract: pod with PO 55812 and exceptions -> needs_review. The message
#                  run does nothing; the document_processed run creates one Hero task
#                  with the PO found, the load's PO and the exceptions.
# The judge reads the Hero task: it must give a person what they need to fix the POD.
id: p2_pod_exceptions_needs_review
title: "A POD with exceptions and a wrong PO goes to a Hero and does not deliver the load (Acme)"
suite: docs
tags: [regression, sop:proof_of_delivery, sop:documents, sop:escalation]
description: >-
  The document check finds a PO mismatch, so the POD needs review: one Hero task with the
  values found, the POD request stays open, the stage stays at_delivery, and the driver
  is told nothing.
load: fixtures/load_481207.json
load_overrides:
  broker: {id: acme, name: Acme Freight}
  stage: to_delivery
date: 2026-10-14
start: "09:00"
steps:
  - at: "09:10"
    note: "Arrival at Valley DC: the POD becomes due at 11:11"
    message: {channel: sms, sender: drv_20931, body: "checked in at valley dc, they are unloading us now"}
    expect:
      actions:
        - {kind: stage_update, stage: at_delivery, count: 1}
      obligations:
        pod: {status: open, attempts: 0}
      timers: {pending: 1, due_at: "11:11"}

  - at: "09:50"
    note: "The POD arrives with exceptions and a PO that does not match the load"
    message:
      channel: sms
      sender: drv_20931
      body: ""
      attachments:
        - {filename: pod.pdf, fixture: fixtures/docs/pod_exceptions.pdf, content_type: application/pdf}
    expect:
      intent: document_processed
      tools_used: [create_hero_task]
      actions:
        - {kind: hero_task, contains: ["55812"], count: 1}
      obligations:
        pod: {status: open, attempts: 0}
      runs: 2
      judge:
        rubric: |-
          1. A Hero task says what is wrong with the POD: the PO on it (55812) differs from the load's PO (55821), and it notes exceptions (2 cases damaged, 1 short).
          2. It says the load was not set to delivered, and what the Hero should check or do.
          3. Nothing is sent to the driver about the POD.
        min_score: 0.7
    forbid:
      - {kind: stage_update}
      - {kind: sms}
      - {kind: email}
