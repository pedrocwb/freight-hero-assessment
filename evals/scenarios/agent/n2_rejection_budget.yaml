# N2: the rejection budget. An agent that keeps proposing actions the rules refuse is
# stopped and its event goes to a Hero, while the actions that were accepted still run.
#
# The broker's limits (`BrokerLimits.max_rejections`, 3 in the standard catalog) bound the
# refused tool calls of one run. Over the budget, the run escalates with the blocked task
# (`escalation.BLOCKED_TITLE`) and the accepted actions run first (card W3-AGT).
#
# Expected timeline (Client A, load 481207 at_delivery, 2026-10-14, America/Los_Angeles):
#   step 0  10:05  driver SMS "all unloaded, empty now. what next?".
#           10:06  run: gate (status_update, act) and one agent call whose transcript is
#                  one accepted call and four refused ones, each by a low-severity rule:
#                  - write_tms_note: accepted (action #1);
#                  - close_obligation(eta_request): obligation_exists, none is open;
#                  - schedule_timer(eta_request): obligation_exists, none is open;
#                  - update_stage(to_pickup): stage_moves_forward, at_delivery cannot go
#                    back to to_pickup;
#                  - send_sms to dsp_4410: channel_allowed, the dispatcher has email only.
#                  4 refusals > 3: escalated. The TMS note is written; one blocked task.
#
# No SMS and no stage update leave: every one of them was refused.
id: n2_rejection_budget
title: An agent refused more often than its budget allows is stopped and handed to a Hero
suite: agent
tags: [regression, scripted_only, sop:status_updates, sop:escalation]
description: >-
  Four refused tool calls in one run, over the broker's max_rejections of 3: the run
  escalates with the blocked task and the accepted TMS note still runs.
load: fixtures/load_481207.json
load_overrides:
  stage: at_delivery
date: 2026-10-14
start: "10:00"
steps:
  - at: "10:05"
    note: "The driver is empty at Valley DC; a confused agent keeps proposing refused actions"
    message: {channel: sms, sender: drv_20931, body: "all unloaded, empty now. what next?"}
    script:
      gate:
        - {intent: status_update, act: true, reason: "The driver reports the load is unloaded."}
      agent:
        - rationale: >-
            A confused agent: one useful note, then four actions the rules refuse, one
            more than the broker's budget of three.
          tool_calls:
            - name: write_tms_note
              args: {text: "10:05 the driver reports the trailer unloaded and empty at Valley DC."}
              result: "accepted as action #1"
            - name: close_obligation
              args: {kind: eta_request, status: satisfied}
              result: "rejected by obligation_exists: close_obligation needs an open eta_request obligation"
            - name: schedule_timer
              args: {kind: eta_request, due_in_minutes: 30}
              result: "rejected by obligation_exists: schedule_timer needs an open eta_request obligation"
            - name: update_stage
              args: {stage: to_pickup}
              result: "rejected by stage_moves_forward: cannot move back from at_delivery to to_pickup"
            - name: send_sms
              args: {contact_id: dsp_4410, text: "The driver is empty at Valley DC."}
              result: "rejected by channel_allowed: sms is not a channel of dsp_4410"
          actions: []
    expect:
      tools_used: [write_tms_note]
      tools_refused: [close_obligation, schedule_timer, update_stage, send_sms]
      min_rejections: 4
      actions:
        - {kind: tms_note, count: 1}
        - {kind: hero_task, contains: ["blocked by a safety check"], count: 1}
      run_status: [escalated]
      llm_calls: 2
    forbid:
      - {kind: sms}
      - {kind: email}
      - {kind: stage_update}
