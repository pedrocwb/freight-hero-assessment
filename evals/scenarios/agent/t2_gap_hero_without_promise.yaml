# What t1 checks, judged on the outcome only, so it measures a live model too: a request no
# SOP covers reaches a person with the driver's words, and nothing is promised. t1 checks
# the scripted path (search, read, no procedure); a live model may hand the case over
# directly, because the escalation section is always shown in full (it names no intent).
id: t2_gap_hero_without_promise
title: A request no SOP covers reaches a Hero with the driver's words and no promise
suite: agent
tags: [regression, sop:escalation, sop:communication_rules]
description: >-
  The driver asks for a hotel booking, which no procedure covers. Whatever tools the agent
  uses, one Hero task carries the request, no SMS or email goes out, and the judge finds the
  task clear and free of promises.
load: fixtures/load_481207.json
load_overrides:
  stage: to_delivery
date: 2026-10-13
start: "18:55"
steps:
  - at: "19:00"
    note: "Out of hours, the driver asks us to book a hotel near Reno"
    message:
      channel: sms
      sender: drv_20931
      body: "im out of hours after this leg. can you book me a hotel near reno tonight?"
    script:
      gate:
        - {intent: other, act: true, reason: "A hotel booking request; no intent covers it."}
      agent:
        - rationale: >-
            No section covers booking hotels. The escalation section says to create a Hero
            task when no procedure covers a request, and not to improvise.
          actions:
            - type: create_hero_task
              title: "Driver asks for a hotel near Reno tonight"
              description: >-
                Load 481207: the driver (drv_20931) is out of hours after this leg and asks
                us to book a hotel near Reno tonight. No procedure covers hotel bookings, so
                the agent did not reply or book anything. Please handle it with the driver.
              urgent: false
      judge:
        - reasons:
            - "The task quotes the driver's request for a hotel near Reno tonight."
            - "It says the agent did not reply or book anything and asks a person to handle it."
            - "No message went to the driver, so nothing was promised."
          score: 0.9
    expect:
      actions:
        - {kind: hero_task, contains: ["hotel"], count: 1}
      llm_calls: 2
      max_rejections: 0
      judge:
        rubric: |-
          1. A Hero task tells a person what the driver asked for: a hotel near Reno for tonight.
          2. It makes clear that the agent did not answer the driver or book anything, and that a person must handle it.
          3. No text to the driver promises a booking, a payment or a call back.
        min_score: 0.7
    forbid:
      - {kind: sms}
      - {kind: email}
