# The quality gates of every change: lint, types, layer rules, tests with coverage and
# the SOP lint. Each gate is a Makefile target, so `make ci` runs the same checks locally.
# The scenario evals are live LangSmith experiments that spend money, so they run by hand
# (evals-live.yml), never here. The Postgres tests (`make integration`) and the image build
# are jobs of their own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the run it replaces; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The uv that writes uv.lock locally. Bump it together with the lock format.
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.13"

jobs:
  checks:
    name: Lint, types, layers, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag after v7, so it is pinned to a release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The hooks a contributor may have skipped locally: whitespace, YAML, and the
      # block on committed .env files. The rest of the hooks run as their own steps.
      - name: File hygiene (pre-commit)
        env:
          SKIP: ruff-check,ruff-format,pyright,lint-imports
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint (ruff check, ruff format --check)
        run: make lint

      - name: Types (pyright)
        run: make typecheck

      - name: Layer rules (import-linter)
        run: make arch

      - name: Tests with coverage (unit, contract, property)
        run: make cov

      - name: Durable workflows (Temporal time-skipping server, scripted LLM)
        run: make temporal-test

      # Errors in any SOP file fail the build; sections no scenario covers only warn.
      - name: SOP lint
        run: make sop-lint

  # The Postgres tests: every contract suite on Postgres too, the migrations, the
  # broker profile persistence and the assignment's scenario on both stores.
  integration:
    name: Integration tests (Postgres)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The image of docker-compose.yml: Postgres 17 with pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://agent:agent@localhost:5432/agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # What the compose `migrate` service runs before the app, from an empty database.
      - name: Migrations (agent db migrate)
        run: uv run agent db migrate

      # `-rs` lists what was skipped and why: nothing should be.
      - name: Integration tests
        run: make integration TEST_DATABASE_URL=$DATABASE_URL

  # The image `docker compose up --build` runs: it builds (web UI included), starts with
  # no model key or database, answers liveness and serves the UI.
  image:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: docker build --tag freight-agent:ci .

      - name: Serve the API and the UI
        run: |
          docker run --detach --name app --publish 127.0.0.1:8000:8000 freight-agent:ci
          for _ in $(seq 30); do
            curl --silent --fail http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8000/api/health
          curl --silent --fail http://127.0.0.1:8000/ | grep -q '<div id="root">'

      - name: Container log
        if: always()
        run: docker logs app || true
