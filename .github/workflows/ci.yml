# The quality gates of every change: lint, types, layer rules, tests with coverage and
# the scenario evals (core, agent and docs suites) in scripted and replay mode. Each gate
# is a Makefile target, so `make ci` runs the same checks locally. The image build is a
# job of its own (`docker build .`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the run it replaces; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The uv that writes uv.lock locally. Bump it together with the lock format.
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.13"

jobs:
  checks:
    name: Lint, types, layers, tests, evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag after v7, so it is pinned to a release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The hooks a contributor may have skipped locally: whitespace, YAML, and the
      # block on committed .env files. The rest of the hooks run as their own steps.
      - name: File hygiene (pre-commit)
        env:
          SKIP: ruff-check,ruff-format,pyright,lint-imports
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint (ruff check, ruff format --check)
        run: make lint

      - name: Types (pyright)
        run: make typecheck

      - name: Layer rules (import-linter)
        run: make arch

      - name: Tests with coverage (unit, contract, property)
        run: make cov

      # Errors in any SOP file fail the build; sections no scenario covers only warn.
      - name: SOP lint
        run: make sop-lint

      # Every suite under evals/scenarios/ of `make eval` (core, agent, docs), each run
      # even when one before it failed. Exit 1: a regression scenario failed; 2: the
      # harness could not run a scenario.
      - name: Evals, scripted mode
        run: make eval

      # The real model's recorded answers (evals/cassettes), offline and without a key.
      # A changed prompt, SOP, scenario or model misses its recording and fails here:
      # re-record each suite with `uv run agent eval run --suite S --mode record
      # --cost-cap-usd 0.20`.
      # Scenarios tagged scripted_only (guardrail controls) are skipped here.
      - name: Evals, replay mode
        run: make eval-replay

  # The image `docker compose up --build` runs: it builds (web UI included), starts with
  # no key (replay, memory), answers its health check and serves the UI.
  image:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: docker build --tag freight-agent:ci .

      - name: Serve the API and the UI
        run: |
          docker run --detach --name app --publish 127.0.0.1:8000:8000 freight-agent:ci
          for _ in $(seq 30); do
            curl --silent --fail http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8000/api/health
          curl --silent --fail http://127.0.0.1:8000/ | grep -q '<div id="root">'

      - name: Container log
        if: always()
        run: docker logs app || true
