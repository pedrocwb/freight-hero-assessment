# Scenario evals against the real models through OpenRouter, each suite a LangSmith
# experiment (dataset freight-agent-<suite>). Started by hand from the Actions tab,
# because every run spends money; the cost cap bounds each suite's experiment. The
# results live in LangSmith: the job prints each experiment's link and pass^k table.
#
# The command, per suite:
#   uv run agent eval run --suite core --k 1 --cost-cap-usd 0.10
# `--k` repeats each scenario k times (pass^k needs every repetition to pass).
# `--cost-cap-usd` stops playing examples once the experiment spent it (exit 3).
name: Evals (live)

on:
  workflow_dispatch:
    inputs:
      suites:
        description: Scenario suites, space-separated
        type: string
        default: core agent docs
      k:
        description: Repetitions per scenario
        type: number
        default: 1
      cost_cap_usd:
        description: The most one suite's experiment may spend, in USD
        type: string
        default: "0.10"

permissions:
  contents: read

# One live run at a time, so two runs never spend against the same budget at once.
concurrency:
  group: evals-live
  cancel-in-progress: false

env:
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.13"

jobs:
  live:
    name: Live evals (${{ inputs.suites }}, k=${{ inputs.k }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Inputs reach the shell as environment variables, never as interpolated code.
      - name: Check inputs and the keys
        env:
          SUITES: ${{ inputs.suites }}
          K: ${{ inputs.k }}
          COST_CAP_USD: ${{ inputs.cost_cap_usd }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$SUITES" =~ ^[A-Za-z0-9_.\ -]+$ ]] || fail "suites must be plain names, got '$SUITES'"
          [[ "$K" =~ ^[1-9][0-9]*$ ]] || fail "k must be a positive integer, got '$K'"
          [[ "$COST_CAP_USD" =~ ^[0-9]+(\.[0-9]+)?$ ]] || fail "cost_cap_usd must be a number, got '$COST_CAP_USD'"
          [ -n "$OPENROUTER_API_KEY" ] || fail "the OPENROUTER_API_KEY repository secret is not set"
          [ -n "$LANGSMITH_API_KEY" ] || fail "the LANGSMITH_API_KEY repository secret is not set"

      - name: Run live evals
        env:
          SUITES: ${{ inputs.suites }}
          EVAL_K: ${{ inputs.k }}
          EVAL_COST_CAP_USD: ${{ inputs.cost_cap_usd }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: freight-agent
        run: make eval SUITES="$SUITES" EVAL_K="$EVAL_K" EVAL_COST_CAP_USD="$EVAL_COST_CAP_USD"
